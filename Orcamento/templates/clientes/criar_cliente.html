{% extends 'base.html' %}

{% block title %}Novo Cliente - CL Máquinas{% endblock %}

{% block content %}
<div class="top-bar">
  <h2><i class="fas fa-user-plus" style="margin-right: 0.5rem;"></i> Novo Cliente</h2>
</div>

<div class="card-container" style="max-width: 600px;">
  <div class="card-body">
    <form method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label for="nome">Nome*</label>
        <input type="text" id="nome" name="nome" required autofocus>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <a href="{% url 'orcamento:listar_clientes' %}" style="text-align: center;">
          <button type="button" class="btn btn-primary" style="width: 100%;">Cancelar</button>
        </a>
        <button type="submit" class="btn btn-success" style="width: 100%;">Salvar Cliente</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
