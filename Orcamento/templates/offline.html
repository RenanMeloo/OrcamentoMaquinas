<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sem conexão - CL Máquinas</title>
<style>
  :root{
    --navy: #1B2A45;
    --navy-soft: #33435F;
    --steel: #64748B;
    --bg: #F4F5F7;
    --card: #FFFFFF;
    --border: #E3E6EB;
    --green: #16A34A;
  }

  body{
    background: var(--bg);
    color: var(--navy);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
  }

  .app-shell{
    max-width: 420px;
    margin: 0 auto;
    padding: 1.25rem 1rem 2rem;
    text-align: center;
  }

  .brand-card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.25rem 1.25rem 0.5rem;
    margin-bottom: 1.5rem;
  }
  .brand-card h1{
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    margin-bottom: 0.15rem;
  }
  .brand-card p{
    color: var(--steel);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    margin-bottom: 1rem;
  }
  .brand-rule{
    height: 3px;
    background: var(--navy);
    border-radius: 2px;
    width: 60px;
    margin: 0 auto 1rem;
  }

  .icon-offline{
    font-size: 2.75rem;
    margin-bottom: 0.75rem;
  }

  h2{
    font-size: 1.2rem;
    font-weight: 800;
    margin-bottom: 0.5rem;
  }

  p.msg{
    color: var(--steel);
    font-size: 0.92rem;
    margin-bottom: 1.5rem;
  }

  .btn-voltar{
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0.8rem;
    width: 100%;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-voltar:hover{ background: var(--navy-soft); }
</style>
</head>
<body>

<div class="app-shell">

  <div class="brand-card">
    <h1>CL MÁQUINAS</h1>
    <p>MECÂNICA PESADA</p>
    <div class="brand-rule"></div>
  </div>

  <div class="icon-offline">📶</div>
  <h2>Você está offline</h2>
  <p class="msg">Não foi possível conectar à internet. Verifique sua conexão e tente novamente.</p>

  <button type="button" class="btn-voltar" onclick="window.location.reload()">
    TENTAR NOVAMENTE
  </button>

</div>

</body>
</html>
